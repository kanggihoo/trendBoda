[project]
name = "trendboda-backend"
version = "0.1.0"
description = "TrendBoda FastAPI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "asyncpg>=0.30.0",
  "fastapi[standard]>=0.115.0",
  "feedparser>=6.0.11",
  "httpx>=0.28.0",
  "pydantic-settings>=2.8.0",
]

[dependency-groups]
dev = [
  "pyright>=1.1.390",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "pytest-cov>=6.0.0",
  "respx>=0.22.0",
  "ruff>=0.8.0",
  "testcontainers[postgres]>=4.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trendboda"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
asyncio_mode = "auto"
markers = [
  "integration: requires external services such as Docker and Postgres",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
strict = ["src"]
reportMissingTypeStubs = false
