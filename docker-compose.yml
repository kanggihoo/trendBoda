services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trendboda
      POSTGRES_PASSWORD: trendboda
      POSTGRES_DB: trendboda
    ports:
      - "5432:5432"
    volumes:
      - trendboda-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trendboda -d trendboda"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  trendboda-postgres-data:
